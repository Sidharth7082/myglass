name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  # Arch Linux Archive snapshot that ships Hyprland 0.56.2-4, the version this
  # release targets (see .hyprland-version and hyprpm.toml commit_pins).
  # Hyprland's plugin ABI changes every minor release, so `pacman -S hyprland`
  # from a rolling mirror would test against an unrelated API. Bump this
  # snapshot together with .hyprland-version on each release.
  ALA_SNAPSHOT: "2026/10/12"

jobs:
  build:
    name: Build (Hyprland 0.56.2)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Pin Arch snapshot and install dependencies
        run: |
          echo "Server = https://archive.archlinux.org/repos/${ALA_SNAPSHOT}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            base-devel \
            hyprland \
            pixman \
            libdrm \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify pinned Hyprland version
        run: |
          actual="$(pkg-config --modversion hyprland)"
          expected="$(cat .hyprland-version)"
          echo "Hyprland ${actual} (expected ${expected})"
          case "${actual}" in
            "${expected}"*) ;;
            *) echo "::error::Hyprland ${actual} does not match .hyprland-version ${expected}"; exit 1 ;;
          esac

      - name: Build
        run: |
          make -j$(nproc)

  build-latest:
    name: Build (latest Hyprland, informational)
    runs-on: ubuntu-latest
    # Upstream ABI changes surface here without turning main red: the pinned
    # release build above is the one users install via hyprpm.
    continue-on-error: true
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            base-devel \
            hyprland \
            pixman \
            libdrm \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          make -j$(nproc)

